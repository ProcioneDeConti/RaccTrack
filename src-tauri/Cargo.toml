[package]
name = "racctrack-adsb"
version = "0.1.0"
description = "RaccTrack (ADS-B) — free, no-paywall ADS-B flight tracker for North America"
authors = ["ProcioneDeConti"]
license = "Apache-2.0"
repository = "https://github.com/ProcioneDeConti/RaccTrack"
edition = "2021"
rust-version = "1.77"

[lib]
name = "racctrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2.4"
tauri-plugin-os = "2.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }

rusqlite = { version = "0.32", features = ["bundled"] }
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"
arc-swap = "1"

anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

flate2 = "1"
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
