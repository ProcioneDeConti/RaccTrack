[package]
name = "racctrack-adsb"
version = "0.3.0"
description = "RaccTrack (ADS-B) — free, no-paywall ADS-B flight tracker for North America"
authors = ["ProcioneDeConti"]
license = "Apache-2.0"
repository = "https://github.com/ProcioneDeConti/RaccTrack"
edition = "2021"
rust-version = "1.77"

[lib]
name = "racctrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Direct RTL-SDR dongle support: rs-rtl (MIT, pure-Rust USB device driver, no
# libusb/C dep) for raw IQ capture; adsb_deku (MIT) for Mode S/ADS-B message
# decode once we've demodulated bytes ourselves (see ingest/rtlsdr/demod.rs —
# deliberately not using the GPL-licensed dump1090_rs/librtlsdr-rs).
rs-rtl = "0.4"
# crates.io 0.8.0 doesn't build (published against a deku range with a
# breaking derive-macro incompatibility); master already carries the fix
# (bumped its own deku requirement) but hasn't been cut as a release yet.
adsb_deku = { git = "https://github.com/rsadsb/adsb_deku", branch = "master", package = "adsb_deku" }
# Elevated-launch helper for the Settings "Fix USB driver" button (spawns a
# downloaded Zadig with a UAC prompt — driver installation on Windows can't
# go through a plain CreateProcess, it needs ShellExecute's "runas" verb).
runas = "1.2"
# ATC voice audio output (AM-demodulated RTL-SDR airband) — cross-platform,
# talks to WASAPI on Windows directly, no C toolchain/system lib needed.
cpal = "0.15"
# ATC session recording — plain, pure-Rust WAV writer.
hound = "3"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2.4"
tauri-plugin-os = "2.3"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }

rusqlite = { version = "0.32", features = ["bundled"] }
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"
arc-swap = "1"

anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

flate2 = "1"
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
quick-xml = { version = "0.36", features = ["serialize"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
